<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AR 시험</title>
<style>
  body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#10151a;color:#eef}
  #intro{padding:20px;max-width:560px;margin:0 auto}
  button,a.btn{font:inherit;padding:12px 16px;border-radius:10px;border:0;background:#2f7dff;color:#fff;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}
  button.sub{background:#46505c}
  #log{white-space:pre-wrap;font:12px ui-monospace,monospace;background:#0006;padding:10px;border-radius:8px;margin-top:12px}
  #overlay{position:fixed;inset:0;pointer-events:none;display:none}
  #overlay .box{pointer-events:auto;position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:#000b;padding:10px 12px;border-radius:12px}
  #overlay .top{pointer-events:auto;position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));background:#000b;padding:8px 12px;border-radius:12px;font-size:13px}
</style></head>
<body>
<div id="intro">
  <h2>AR 시험 (방 데이터 없음)</h2>
  <p>바닥의 모서리 두 곳을 차례로 누르면 3.69 × 3.40 m 방 윤곽(주황)과 작은 상자가 놓입니다. 앱클립·WebXR이 동작하는지 보는 시험 페이지입니다.</p>
  <button id="start">AR 시작</button>
  <a class="btn sub" id="clip" href="#">앱클립(Needle Go)으로 열기</a>
  <div id="log"></div>
</div>
<div id="overlay">
  <div class="top" id="status">바닥을 천천히 비추세요</div>
  <div class="box"><button id="undo" class="sub">다시</button><button id="end" class="sub">끝내기</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $ = s => document.querySelector(s), log = m => { $('#log').textContent += m + '\n'; };
const here = location.href.split('#')[0];
$('#clip').href = 'https://appclip.needle.tools/ar?url=' + encodeURIComponent(here);
log('주소: ' + here);
log('navigator.xr: ' + (navigator.xr ? '있음' : '없음'));
log('UA: ' + navigator.userAgent.slice(0, 90));
let supported = false;
try { supported = navigator.xr ? await navigator.xr.isSessionSupported('immersive-ar') : false; } catch (e) { log('isSessionSupported 오류: ' + e.message); }
log('immersive-ar 지원: ' + supported);

const ROOM = { w: 3.69, d: 3.4 };
let renderer, scene, camera, session, hitSource, refSpace, reticle, room, taps = [];
function buildRoom() {
  const g = new THREE.Group();
  const orange = new THREE.MeshBasicMaterial({ color: 0xff7a00 }), blue = new THREE.MeshBasicMaterial({ color: 0x1e6bff });
  const { w, d } = ROOM, t = 0.06, h = 0.01;
  const box = (sx, sy, sz, x, y, z, m = orange) => { const b = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), m); b.position.set(x, y, z); g.add(b); };
  box(w, h, t, w / 2, h / 2, -t / 2); box(w, h, t, w / 2, h / 2, -d + t / 2);
  box(t, h, d, t / 2, h / 2, -d / 2); box(t, h, d, w - t / 2, h / 2, -d / 2);
  box(t, 1.0, t, t / 2, 0.5, -t / 2); box(t, 1.0, t, t / 2, 0.5, -d + t / 2); box(t, 1.0, t, w - t / 2, 0.5, -d + t / 2);
  box(t, 1.6, t, w - t / 2, 0.8, -t / 2, blue);          // 창 두 개가 만나는 모서리(첫 번째로 누를 곳)
  const f = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.75, 0.5), new THREE.MeshNormalMaterial()); f.position.set(0.9, 0.375, -1.2); g.add(f);   // 가구 대신 상자
  return g;
}
function align() {   // taps[0]=모델 (w,0) 모서리, taps[1]=모델 (0,0) 모서리
  const A = taps[0], B = taps[1], dx = A.x - B.x, dz = A.z - B.z;
  room.rotation.set(0, Math.atan2(-dz, dx), 0);
  room.position.set(B.x, (A.y + B.y) / 2, B.z);
  room.visible = true;
  const len = Math.hypot(dx, dz);
  $('#status').textContent = `정렬됨 · 두 모서리 거리 ${len.toFixed(2)} m (실제는 ${ROOM.w} m 가까워야 함)`;
}
function reset() { taps = []; room.visible = false; $('#status').textContent = '방 안에서 창 있는 벽을 보고 서서, 왼쪽 모서리를 누르세요'; }
async function start() {
  try {
    if (!navigator.xr) throw Error('WebXR 없음');
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType('local');
    scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.02, 50);
    room = buildRoom(); room.visible = false; scene.add(room);
    reticle = new THREE.Mesh(new THREE.RingGeometry(0.04, 0.06, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x00e08a }));
    reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2));
    const overlay = $('#overlay');
    session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay', 'local-floor'], domOverlay: { root: overlay } });
    log('세션 시작됨. 활성 기능: ' + (session.enabledFeatures ? [...session.enabledFeatures].join(', ') : '(알 수 없음)'));
    document.body.appendChild(renderer.domElement); renderer.domElement.style.cssText = 'position:fixed;inset:0';
    overlay.style.display = 'block'; $('#intro').style.display = 'none';
    await renderer.xr.setSession(session);
    refSpace = renderer.xr.getReferenceSpace();
    const viewer = await session.requestReferenceSpace('viewer');
    hitSource = await session.requestHitTestSource({ space: viewer });
    reset();
    session.addEventListener('select', () => {
      if (!reticle.visible || taps.length >= 2) return;
      taps.push(new THREE.Vector3().setFromMatrixPosition(reticle.matrix));
      if (taps.length === 1) $('#status').textContent = '이제 오른쪽 모서리를 누르세요';
      else align();
    });
    session.addEventListener('end', () => { log('세션 종료'); overlay.style.display = 'none'; $('#intro').style.display = 'block'; renderer.setAnimationLoop(null); renderer.domElement.remove(); });
    renderer.setAnimationLoop((t, frame) => {
      if (frame && hitSource) {
        const hits = frame.getHitTestResults(hitSource);
        if (hits.length) { reticle.visible = true; reticle.matrix.fromArray(hits[0].getPose(refSpace).transform.matrix); }
        else reticle.visible = false;
      }
      renderer.render(scene, camera);
    });
  } catch (e) { log('시작 실패: ' + e.message); $('#intro').style.display = 'block'; }
}
$('#start').onclick = start;
$('#undo').onclick = reset;
$('#end').onclick = () => session?.end();
</script></body></html>
